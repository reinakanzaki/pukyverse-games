<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Mushroom Cat 未確認通信記録"
    >

    <title>
        UNKNOWN CONNECTION
    </title>

    <link
        rel="stylesheet"
        href="../../../css/mushroom-chat.css"
    >
</head>

<body class="mushroom-chat-body">

    <!-- =========================================
         背景演出
    ========================================== -->
    <div
        class="mushroom-background-noise"
        aria-hidden="true"
    ></div>

    <div
        class="mushroom-background-scanlines"
        aria-hidden="true"
    ></div>

    <div
        class="mushroom-background-glow"
        aria-hidden="true"
    ></div>

    <!-- =========================================
         チャット画面
    ========================================== -->
    <main class="mushroom-chat-layout">

        <section
            class="mushroom-chat-window"
            id="mushroomChatWindow"
        >

            <!-- =====================================
                 上部バー
            ====================================== -->
            <header class="mushroom-chat-header">

                <div class="mushroom-chat-header-left">

                    <span
                        class="mushroom-chat-status-light"
                        id="connectionLight"
                    ></span>

                    <div>

                        <strong id="connectionTitle">
                            UNKNOWN CONNECTION
                        </strong>

                        <small id="connectionStatus">
                            接続を確認しています
                        </small>

                    </div>

                </div>

                <div class="mushroom-chat-header-right">

                    <span>
                        SIGNAL
                    </span>

                    <strong id="signalValue">
                        07%
                    </strong>

                </div>

            </header>

            <!-- =====================================
                 モニター
            ====================================== -->
            <section
                class="mushroom-monitor-area"
                aria-label="通信映像"
            >

                <div class="mushroom-monitor">

                    <div
                        class="mushroom-monitor-screen"
                        id="mushroomMonitorScreen"
                    >

                        <!-- 初期状態 -->
                        <div
                            class="mushroom-monitor-placeholder"
                            id="monitorPlaceholder"
                        >

                            <span>
                                NO
                            </span>

                            <span>
                                SIGNAL
                            </span>

                        </div>

                        <!-- Mushroom Cat画像 -->
                        <img
                            src="../../../images/secret/mushroom-cat.png"
                            alt="Mushroom Cat"
                            class="mushroom-monitor-character"
                            id="mushroomCharacter"
                        >

                        <div
                            class="mushroom-monitor-scanlines"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mushroom-monitor-static"
                            id="monitorStatic"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mushroom-monitor-vignette"
                            aria-hidden="true"
                        ></div>

                        <div
                            class="mushroom-monitor-label"
                            id="monitorLabel"
                        >
                            RECIPIENT : UNKNOWN
                        </div>

                    </div>

                    <footer class="mushroom-monitor-footer">

                        <div>

                            <span class="mushroom-monitor-power"></span>

                            <span>
                                PUKYVERSE DISPLAY
                            </span>

                        </div>

                        <span id="monitorClock">
                            --:--:--
                        </span>

                    </footer>

                </div>

                <div
                    class="mushroom-monitor-stand"
                    aria-hidden="true"
                ></div>

                <div
                    class="mushroom-monitor-base"
                    aria-hidden="true"
                ></div>

            </section>

            <!-- =====================================
                 メッセージ履歴
            ====================================== -->
            <section
                class="mushroom-message-area"
                id="messageArea"
                aria-live="polite"
                aria-label="メッセージ履歴"
            >

                <div
                    class="mushroom-message-log"
                    id="messageLog"
                ></div>

                <div
                    class="mushroom-typing-indicator"
                    id="typingIndicator"
                    aria-hidden="true"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </section>

            <!-- =====================================
                 入力欄
            ====================================== -->
            <footer class="mushroom-input-area">

                <label
                    for="recipientInput"
                    class="mushroom-input-label"
                    id="inputLabel"
                >
                    RECIPIENT
                </label>

                <div class="mushroom-input-row">

                    <input
                        type="text"
                        id="recipientInput"
                        class="mushroom-recipient-input"
                        placeholder="接続を待っています"
                        autocomplete="off"
                        spellcheck="false"
                        maxlength="30"
                        disabled
                    >

                    <button
                        type="button"
                        id="sendButton"
                        class="mushroom-send-button"
                        disabled
                    >
                        送信
                    </button>

                </div>

                <p
                    class="mushroom-input-hint"
                    id="inputHint"
                >
                    通信が開始されるまでお待ちください。
                </p>

            </footer>

        </section>

    </main>

    <!-- =========================================
         全画面ノイズ
    ========================================== -->
    <div
        class="mushroom-screen-corruption"
        id="screenCorruption"
        aria-hidden="true"
    >

        <div class="mushroom-corruption-noise"></div>

        <p id="corruptionText">
            SIGNAL INTERRUPTED
        </p>

    </div>

    <!-- =========================================
         エンディング表示
    ========================================== -->
    <div
        class="mushroom-ending-overlay"
        id="endingOverlay"
        aria-hidden="true"
    >

        <div class="mushroom-ending-content">

            <span class="mushroom-ending-code">
                CONNECTION STATUS
            </span>

            <strong>
                MUSHROOM CAT IS NOW ONLINE
            </strong>

            <p>
                Thank you delivered.
            </p>

        </div>

    </div>

    <script src="../../js/mushroom-chat.js"></script>

</body>

</html>
